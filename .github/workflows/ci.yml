name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit and API tests
        run: pytest -v
      - name: Retrain from the committed dataset (smoke test, no backtest)
        run: python -m aeria_forecast.train --skip-backtest --out /tmp/model.joblib

  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: docker build -t aeria-forecast .
      - name: Container answers a replayed forecast
        run: |
          docker run -d --name api -p 8083:8083 aeria-forecast
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8083/health && break; sleep 2; done
          curl -sf "http://127.0.0.1:8083/forecast/FR05090?issue_date=2026-08-12" | tee /dev/stderr | grep -q atmo_index
